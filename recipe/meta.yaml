{% set name = "langchain-together" %}
{% set version = "0.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/langchain_together-{{ version }}.tar.gz
  sha256: f488392ecdfeb05c5f2f8162596aff43a3b4d6a4ccf2f821d6e2602a0c5563c6

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - poetry-core >=1.0.0
    - pip
  run:
    - h11 >=0.16.0
    - langsmith >=0.6.3
    - urllib3 >=2.6.3
    - python >={{ python_min }},<4.0
    - langchain-core >=1.2.22,<2
    - langchain-openai >=1.1.12,<2
    - requests >=2.32.4,<3
    - aiohttp >=3.13.3,<4.0.0

test:
  imports:
    - langchain_together
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/langchain-ai/langchain
  summary: An integration package connecting Together AI and LangChain
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jan-janssen
